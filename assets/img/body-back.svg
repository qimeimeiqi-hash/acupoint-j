<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" role="img" aria-labelledby="bodyBackTitle">
  <title id="bodyBackTitle">2岁儿童人体背面示意图（写实解剖图风格）</title>
  <defs>
    <radialGradient id="skinGradB" cx="32%" cy="22%" r="90%">
      <stop offset="0%" stop-color="#F5DCC3"/>
      <stop offset="55%" stop-color="#E3B287"/>
      <stop offset="100%" stop-color="#BE8757"/>
    </radialGradient>
    <linearGradient id="hairGradB" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#5A4230"/>
      <stop offset="100%" stop-color="#332217"/>
    </linearGradient>
    <linearGradient id="shortsGradB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C93A6"/>
      <stop offset="100%" stop-color="#54687A"/>
    </linearGradient>
  </defs>

  <!-- 腿 -->
  <path d="M118,358 C104,400 98,440 99,480 C100,515 101,545 100,565 C99,578 108,582 112,570 C118,548 120,515 122,480 C124,440 130,400 140,362 Z" fill="url(#skinGradB)" stroke="#A8724A" stroke-width="1.2"/>
  <path d="M182,358 C196,400 202,440 201,480 C200,515 199,545 200,565 C201,578 192,582 188,570 C182,548 180,515 178,480 C176,440 170,400 160,362 Z" fill="url(#skinGradB)" stroke="#A8724A" stroke-width="1.2"/>
  <ellipse cx="110" cy="468" rx="11" ry="8" fill="#C98F5E" opacity="0.3"/>
  <ellipse cx="190" cy="468" rx="11" ry="8" fill="#C98F5E" opacity="0.3"/>

  <!-- 脚跟 -->
  <path d="M78,570 C76,562 84,556 100,556 C116,556 126,562 127,572 C128,582 122,590 108,591 C94,592 80,584 78,570 Z" fill="url(#skinGradB)" stroke="#A8724A" stroke-width="1.2"/>
  <path d="M222,570 C224,562 216,556 200,556 C184,556 174,562 173,572 C172,582 178,590 192,591 C206,592 220,584 222,570 Z" fill="url(#skinGradB)" stroke="#A8724A" stroke-width="1.2"/>

  <!-- 手臂（按2岁幼儿真实比例加长：自然下垂时手部约达大腿中部） -->
  <path d="M82,182 C58,196 46,228 40,272 C36,302 34,332 33,358 C32,368 44,372 48,363 C52,346 55,320 60,290 C65,256 75,222 100,198 Z" fill="url(#skinGradB)" stroke="#A8724A" stroke-width="1.2"/>
  <path d="M218,182 C242,196 254,228 260,272 C264,302 266,332 267,358 C268,368 256,372 252,363 C248,346 245,320 240,290 C235,256 225,222 200,198 Z" fill="url(#skinGradB)" stroke="#A8724A" stroke-width="1.2"/>
  <ellipse cx="42" cy="272" rx="8" ry="10" fill="#C98F5E" opacity="0.25"/>
  <ellipse cx="258" cy="272" rx="8" ry="10" fill="#C98F5E" opacity="0.25"/>

  <!-- 手（手背视角） -->
  <path d="M20,350 C18,340 24,332 33,331 C40,330 46,334 49,341 C52,348 52,358 50,368 C48,376 40,381 31,379 C22,377 17,367 18,358 Z" fill="url(#skinGradB)" stroke="#A8724A" stroke-width="1.2"/>
  <path d="M280,350 C282,340 276,332 267,331 C260,330 254,334 251,341 C248,348 248,358 250,368 C252,376 260,381 269,379 C278,377 283,367 282,358 Z" fill="url(#skinGradB)" stroke="#A8724A" stroke-width="1.2"/>

  <!-- 后背躯干 -->
  <path d="M92,180 C74,222 76,270 84,315 C90,345 94,358 104,362 C120,368 180,368 196,362 C206,358 210,345 216,315 C224,270 226,222 208,180 C188,164 112,164 92,180 Z" fill="url(#skinGradB)" stroke="#A8724A" stroke-width="1.2"/>

  <!-- 肩胛骨阴影 -->
  <path d="M116,205 C130,218 132,240 122,256" stroke="#C98F5E" stroke-width="2.4" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M184,205 C170,218 168,240 178,256" stroke="#C98F5E" stroke-width="2.4" fill="none" opacity="0.4" stroke-linecap="round"/>

  <!-- 脊柱沟（真实凹陷阴影效果，捏脊操作参考线；实际可点击路径由 JS 按 data.js 坐标绘制） -->
  <path d="M150,176 C148,230 152,300 150,360" stroke="#A8724A" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.55"/>

  <!-- 短裤 -->
  <path d="M96,335 C96,352 100,372 108,388 C114,398 122,400 130,392 C136,384 138,372 140,360 L160,360 C162,372 164,384 170,392 C178,400 186,398 192,388 C200,372 204,352 204,335 C168,346 132,346 96,335 Z" fill="url(#shortsGradB)" stroke="#465868" stroke-width="1.2"/>

  <!-- 脖子 -->
  <path d="M134,144 C133,155 133,165 136,172 L164,172 C167,165 167,155 166,144 Z" fill="url(#skinGradB)" stroke="#A8724A" stroke-width="1"/>

  <!-- 头（后脑） -->
  <ellipse cx="150" cy="86" rx="54" ry="62" fill="url(#skinGradB)" stroke="#A8724A" stroke-width="1.3"/>
  <path d="M96,84 C90,80 88,90 91,98 C93,104 99,104 100,97 Z" fill="url(#skinGradB)" stroke="#A8724A" stroke-width="1"/>
  <path d="M204,84 C210,80 212,90 209,98 C207,104 201,104 200,97 Z" fill="url(#skinGradB)" stroke="#A8724A" stroke-width="1"/>

  <!-- 后脑头发（覆盖大半个头，单一平滑弧线收边，不做易出错的多段回折） -->
  <path d="M97,95 C93,40 118,12 150,12 C182,12 207,40 203,95 C203,125 180,140 150,140 C120,140 97,125 97,95 Z" fill="url(#hairGradB)"/>
</svg>

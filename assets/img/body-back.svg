<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" role="img" aria-labelledby="bodyBackTitle">
  <title id="bodyBackTitle">卡通小孩背面插画</title>

  <g stroke="#E3A874" stroke-width="2.5" stroke-linejoin="round">
    <!-- 腿 -->
    <path d="M120,360 C108,410 104,480 102,565 C102,578 118,580 120,568 C126,480 130,415 138,362 Z" fill="#FFD9B3"/>
    <path d="M180,360 C192,410 196,480 198,565 C198,578 182,580 180,568 C174,480 170,415 162,362 Z" fill="#FFD9B3"/>
    <!-- 脚跟 -->
    <ellipse cx="103" cy="585" rx="22" ry="12" fill="#FFC896"/>
    <ellipse cx="197" cy="585" rx="22" ry="12" fill="#FFC896"/>
  </g>
  <!-- 脚趾（背面能看到一点点探出的脚趾尖） -->
  <g fill="#FFC896" stroke="#E3A874" stroke-width="1.5">
    <circle cx="94" cy="580" r="3.6"/>
    <circle cx="103" cy="578" r="3.8"/>
    <circle cx="112" cy="580" r="3.6"/>
    <circle cx="188" cy="580" r="3.6"/>
    <circle cx="197" cy="578" r="3.8"/>
    <circle cx="206" cy="580" r="3.6"/>
  </g>

  <g stroke="#E3A874" stroke-width="2.5" stroke-linejoin="round">
    <!-- 手臂 -->
    <path d="M78,188 C50,205 42,250 36,320 C34,335 50,340 54,326 C62,262 72,222 96,196 Z" fill="#FFD9B3"/>
    <path d="M222,188 C250,205 258,250 264,320 C266,335 250,340 246,326 C238,262 228,222 204,196 Z" fill="#FFD9B3"/>
    <circle cx="37" cy="335" r="14" fill="#FFC896"/>
    <circle cx="263" cy="335" r="14" fill="#FFC896"/>
  </g>
  <!-- 手指 -->
  <g stroke="#FFC896" stroke-width="6" stroke-linecap="round">
    <line x1="32" y1="330" x2="20" y2="316"/>
    <line x1="36" y1="325" x2="29" y2="307"/>
    <line x1="41" y1="325" x2="41" y2="305"/>
    <line x1="46" y1="328" x2="54" y2="311"/>
    <line x1="49" y1="337" x2="61" y2="335"/>

    <line x1="268" y1="330" x2="280" y2="316"/>
    <line x1="264" y1="325" x2="271" y2="307"/>
    <line x1="259" y1="325" x2="259" y2="305"/>
    <line x1="254" y1="328" x2="246" y2="311"/>
    <line x1="251" y1="337" x2="239" y2="335"/>
  </g>

  <!-- 后背躯干 -->
  <path d="M96,185 C80,230 82,300 92,358 C110,372 190,372 208,358 C218,300 220,230 204,185 C185,168 115,168 96,185 Z" fill="#FFE3C2" stroke="#E3A874" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 短裤 -->
  <path d="M100,340 C100,375 105,390 118,392 C128,393 130,375 134,360 L166,360 C170,375 172,393 182,392 C195,390 200,375 200,340 C170,352 130,352 100,340 Z" fill="#8FC1E3" stroke="#5FA0CE" stroke-width="2"/>

  <!-- 脊柱沟（浅色引导线，帮助识别"捏脊"操作的中线；实际可点击路径由 JS 按 data.js 坐标绘制） -->
  <path d="M150,172 C148,230 152,300 150,360" stroke="#E8B98C" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- 肩胛骨轮廓提示 -->
  <path d="M118,210 C128,225 128,245 120,258" stroke="#F2C79E" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M182,210 C172,225 172,245 180,258" stroke="#F2C79E" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- 脖子 -->
  <rect x="135" y="150" width="30" height="26" rx="10" fill="#FFD9B3" stroke="#E3A874" stroke-width="2"/>

  <!-- 头（后脑） -->
  <circle cx="150" cy="90" r="65" fill="#FFD9B3" stroke="#E3A874" stroke-width="2.5"/>
  <!-- 耳朵 -->
  <ellipse cx="83" cy="92" rx="9" ry="13" fill="#FFD9B3" stroke="#E3A874" stroke-width="2"/>
  <ellipse cx="217" cy="92" rx="9" ry="13" fill="#FFD9B3" stroke="#E3A874" stroke-width="2"/>
  <!-- 后脑头发（覆盖大半个头） -->
  <path d="M85,90 C85,35 110,15 150,15 C190,15 215,35 215,90 C215,120 205,145 190,158 C200,120 195,70 150,68 C105,70 100,120 110,158 C95,145 85,120 85,90 Z" fill="#7A5641" stroke="#5C4030" stroke-width="2"/>
</svg>

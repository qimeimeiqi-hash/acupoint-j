<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" role="img" aria-labelledby="bodyFrontTitle">
  <title id="bodyFrontTitle">2岁儿童人体正面示意图（写实解剖图风格）</title>
  <defs>
    <radialGradient id="skinGrad" cx="32%" cy="22%" r="90%">
      <stop offset="0%" stop-color="#F5DCC3"/>
      <stop offset="55%" stop-color="#E3B287"/>
      <stop offset="100%" stop-color="#BE8757"/>
    </radialGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#5A4230"/>
      <stop offset="100%" stop-color="#332217"/>
    </linearGradient>
    <linearGradient id="shortsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C93A6"/>
      <stop offset="100%" stop-color="#54687A"/>
    </linearGradient>
  </defs>

  <!-- 腿 -->
  <path d="M118,358 C104,400 98,440 99,480 C100,515 101,545 100,565 C99,578 108,582 112,570 C118,548 120,515 122,480 C124,440 130,400 140,362 Z" fill="url(#skinGrad)" stroke="#A8724A" stroke-width="1.2"/>
  <path d="M182,358 C196,400 202,440 201,480 C200,515 199,545 200,565 C201,578 192,582 188,570 C182,548 180,515 178,480 C176,440 170,400 160,362 Z" fill="url(#skinGrad)" stroke="#A8724A" stroke-width="1.2"/>
  <!-- 膝盖阴影 -->
  <ellipse cx="110" cy="468" rx="11" ry="8" fill="#C98F5E" opacity="0.35"/>
  <ellipse cx="190" cy="468" rx="11" ry="8" fill="#C98F5E" opacity="0.35"/>

  <!-- 脚 -->
  <path d="M78,570 C76,562 84,556 100,556 C116,556 126,562 127,572 C128,582 122,590 108,591 C94,592 80,584 78,570 Z" fill="url(#skinGrad)" stroke="#A8724A" stroke-width="1.2"/>
  <path d="M222,570 C224,562 216,556 200,556 C184,556 174,562 173,572 C172,582 178,590 192,591 C206,592 220,584 222,570 Z" fill="url(#skinGrad)" stroke="#A8724A" stroke-width="1.2"/>
  <!-- 脚趾分割线（写实提示，非卡通圆点） -->
  <g stroke="#A8724A" stroke-width="1" opacity="0.6" fill="none">
    <path d="M85,558 L84,552"/>
    <path d="M95,555 L94,548"/>
    <path d="M105,554 L105,547"/>
    <path d="M115,555 L116,548"/>
    <path d="M215,558 L216,552"/>
    <path d="M205,555 L206,548"/>
    <path d="M195,554 L195,547"/>
    <path d="M185,555 L184,548"/>
  </g>

  <!-- 手臂（按2岁幼儿真实比例加长：自然下垂时手部约达大腿中部，而非卡通短臂只到胯部） -->
  <path d="M82,182 C58,196 46,228 40,272 C36,302 34,332 33,358 C32,368 44,372 48,363 C52,346 55,320 60,290 C65,256 75,222 100,198 Z" fill="url(#skinGrad)" stroke="#A8724A" stroke-width="1.2"/>
  <path d="M218,182 C242,196 254,228 260,272 C264,302 266,332 267,358 C268,368 256,372 252,363 C248,346 245,320 240,290 C235,256 225,222 200,198 Z" fill="url(#skinGrad)" stroke="#A8724A" stroke-width="1.2"/>
  <!-- 肘部阴影 -->
  <ellipse cx="42" cy="272" rx="8" ry="10" fill="#C98F5E" opacity="0.3"/>
  <ellipse cx="258" cy="272" rx="8" ry="10" fill="#C98F5E" opacity="0.3"/>

  <!-- 手（放松自然手型，手指并拢+浅分割线，不做卡通分叉手指） -->
  <path d="M20,350 C18,340 24,332 33,331 C40,330 46,334 49,341 C52,348 52,358 50,368 C48,376 40,381 31,379 C22,377 17,367 18,358 Z" fill="url(#skinGrad)" stroke="#A8724A" stroke-width="1.2"/>
  <path d="M280,350 C282,340 276,332 267,331 C260,330 254,334 251,341 C248,348 248,358 250,368 C252,376 260,381 269,379 C278,377 283,367 282,358 Z" fill="url(#skinGrad)" stroke="#A8724A" stroke-width="1.2"/>
  <g stroke="#A8724A" stroke-width="1" opacity="0.55" fill="none">
    <path d="M25,338 C27,344 27,350 25,355"/>
    <path d="M33,335 C35,342 35,349 33,355"/>
    <path d="M41,336 C43,343 43,350 41,356"/>
    <path d="M275,338 C273,344 273,350 275,355"/>
    <path d="M267,335 C265,342 265,349 267,355"/>
    <path d="M259,336 C257,343 257,350 259,356"/>
  </g>

  <!-- 躯干（锁骨与胸腹线提示） -->
  <path d="M92,180 C74,222 76,270 84,315 C90,345 94,358 104,362 C120,368 180,368 196,362 C206,358 210,345 216,315 C224,270 226,222 208,180 C188,164 112,164 92,180 Z" fill="url(#skinGrad)" stroke="#A8724A" stroke-width="1.2"/>
  <path d="M110,196 C125,204 175,204 190,196" stroke="#C98F5E" stroke-width="1.4" fill="none" opacity="0.55"/>
  <path d="M150,215 L150,340" stroke="#C98F5E" stroke-width="1.2" fill="none" opacity="0.35"/>

  <!-- 短裤 -->
  <path d="M96,335 C96,352 100,372 108,388 C114,398 122,400 130,392 C136,384 138,372 140,360 L160,360 C162,372 164,384 170,392 C178,400 186,398 192,388 C200,372 204,352 204,335 C168,346 132,346 96,335 Z" fill="url(#shortsGrad)" stroke="#465868" stroke-width="1.2"/>

  <!-- 脖子 -->
  <path d="M134,144 C133,155 133,165 136,172 L164,172 C167,165 167,155 166,144 Z" fill="url(#skinGrad)" stroke="#A8724A" stroke-width="1"/>

  <!-- 头 -->
  <ellipse cx="150" cy="86" rx="54" ry="62" fill="url(#skinGrad)" stroke="#A8724A" stroke-width="1.3"/>
  <!-- 耳朵 -->
  <path d="M96,84 C90,80 88,90 91,98 C93,104 99,104 100,97 Z" fill="url(#skinGrad)" stroke="#A8724A" stroke-width="1"/>
  <path d="M204,84 C210,80 212,90 209,98 C207,104 201,104 200,97 Z" fill="url(#skinGrad)" stroke="#A8724A" stroke-width="1"/>

  <!-- 头发（自然短发，无卡通刘海尖角） -->
  <path d="M97,70 C93,32 118,12 150,12 C182,12 207,32 203,70 C201,50 190,34 150,32 C110,34 99,50 97,70 Z" fill="url(#hairGrad)"/>
  <path d="M96,80 C93,68 94,56 98,48" stroke="#332217" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M204,80 C207,68 206,56 202,48" stroke="#332217" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- 眉毛 -->
  <path d="M116,72 Q127,66 138,71" stroke="#4A3624" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M162,71 Q173,66 184,72" stroke="#4A3624" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- 眼睛（写实杏眼，非卡通圆点） -->
  <path d="M115,88 C120,84 132,84 137,88 C132,92 120,92 115,88 Z" fill="#3A281C"/>
  <path d="M163,88 C168,84 180,84 185,88 C180,92 168,92 163,88 Z" fill="#3A281C"/>
  <circle cx="129" cy="87" r="1.1" fill="#fff" opacity="0.7"/>
  <circle cx="177" cy="87" r="1.1" fill="#fff" opacity="0.7"/>

  <!-- 鼻子 -->
  <path d="M150,92 C147,100 146,106 150,109 C151,109.5 152,109 152,108" stroke="#A8724A" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- 嘴（中性表情，非卡通大笑） -->
  <path d="M138,120 Q150,124 162,120" stroke="#A8654A" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85"/>
</svg>
